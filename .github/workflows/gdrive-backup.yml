name: Backup to Google Drive

on:
  push:
    branches:
      - main

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create zip archive (without node_modules)
        run: |
          zip -r site-backup.zip . \
            --exclude "*/node_modules/*" \
            --exclude "*/.git/*" \
            --exclude "*/dist/*"

      - name: Install Google API client
        run: pip install google-auth google-api-python-client

      - name: Upload to Google Drive
        run: |
          python3 << 'EOF'
          import json, os
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2 import service_account

          creds_dict = json.loads(os.environ['GDRIVE_CREDENTIALS'])
          credentials = service_account.Credentials.from_service_account_info(
              creds_dict,
              scopes=['https://www.googleapis.com/auth/drive']
          )
          service = build('drive', 'v3', credentials=credentials)

          folder_id = os.environ['GDRIVE_FOLDER_ID']
          filename = f"backup-{os.environ['RUN_NUMBER']}-{os.environ['SHA'][:7]}.zip"

          file_metadata = {'name': filename, 'parents': [folder_id]}
          media = MediaFileUpload('site-backup.zip', mimetype='application/zip')
          service.files().create(body=file_metadata, media_body=media).execute()
          print(f'Uploaded: {filename}')
          EOF
        env:
          GDRIVE_CREDENTIALS: ${{ secrets.GDRIVE_CREDENTIALS }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
